site_name: AI/ML Senior/Lead Engineer Master Syllabus
site_description: Problem-driven, just-in-time-mathematics curriculum for AI/ML senior/lead engineers.

# EDIT ME (single required manual edit): once the GitHub repository exists,
# uncomment and set this to https://<your-username>.github.io/<your-repo-name>/
# It only affects canonical links/sitemap generation, not page navigation, so it
# is intentionally left unset here — setting it to a repo subpath would make
# `mkdocs serve` serve the site under that subpath instead of http://127.0.0.1:8000/.
# site_url: https://<your-username>.github.io/<your-repo-name>/

repo_name: ai-engineering-master-syllabus
# EDIT ME: uncomment and set once the GitHub repository exists.
# repo_url: https://github.com/<your-username>/<your-repo-name>

docs_dir: docs
site_dir: site
use_directory_urls: true

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.tracking
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables

plugins:
  - search

extra:
  # If a custom domain is added later (via a CNAME file in docs/), update
  # site_url above to match the custom domain instead of the github.io URL.
  generator: false
